name: vib34d_xr_quaternion_sdk
description: 4D geometric visualization toolkit with quaternion-based rotations for Flutter. Supports web, mobile, and desktop with multiple input methods.
version: 1.0.0
homepage: https://github.com/Domusgpt/vib34d-vib3plus
repository: https://github.com/Domusgpt/vib34d-vib3plus
issue_tracker: https://github.com/Domusgpt/vib34d-vib3plus/issues
documentation: https://github.com/Domusgpt/vib34d-vib3plus#readme

topics:
  - visualization
  - quaternion
  - 4d
  - xr
  - geometry
  - flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0
