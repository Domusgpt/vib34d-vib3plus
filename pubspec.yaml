name: vib34d_xr_quaternion_sdk
description: 4D Geometric Processing with XR Quaternion Integration - Advanced quaternion mathematics and spatial computing for Flutter/ARCore/ARKit
version: 1.0.0
homepage: https://parserator.com
repository: https://github.com/Domusgpt/vib34d-xr-quaternion-sdk

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  plugin:
    platforms:
      android:
        package: com.clearseassolutions.vib34d_xr_quaternion_sdk
        pluginClass: Vib34dXrQuaternionSdkPlugin
      ios:
        pluginClass: Vib34dXrQuaternionSdkPlugin
